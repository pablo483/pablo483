<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" role="img" aria-label="Sudarshan GC - Software Engineer (Java Backend)">
  <defs>
    <clipPath id="bannerClipLight">
      <rect x="2" y="2" width="1196" height="326" rx="20" />
    </clipPath>

    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="titleGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#4F46E5;#0D9488;#0284C7" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#0D9488;#0284C7;#4F46E5" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0D9488">
        <animate attributeName="stop-color" values="#0D9488;#0284C7;#4F46E5;#0D9488" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="orbCyanLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbIndigoLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbEmeraldLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </radialGradient>

    <pattern id="gridPatternLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748B" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <linearGradient id="waveGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.06" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <g clip-path="url(#bannerClipLight)">
    <!-- Base Background & Grid -->
    <rect x="2" y="2" width="1196" height="326" fill="url(#bgGradLight)" />
    <rect x="2" y="2" width="1196" height="326" fill="url(#gridPatternLight)" />

    <!-- Animated Aurora Orbs -->
    <circle cx="220" cy="80" r="260" fill="url(#orbCyanLight)">
      <animate attributeName="cx" values="200;310;200" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="70;130;70" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="95" r="270" fill="url(#orbIndigoLight)">
      <animate attributeName="cx" values="990;880;990" dur="13s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;155;90" dur="13s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="290" r="240" fill="url(#orbEmeraldLight)">
      <animate attributeName="r" values="210;270;210" dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Subtle Animated Bottom Waves -->
    <path fill="url(#waveGradLight)" d="M0,285 Q300,255 600,285 T1200,285 L1200,330 L0,330 Z">
      <animate
        attributeName="d"
        dur="8s"
        repeatCount="indefinite"
        values="
          M0,285 Q300,255 600,285 T1200,285 L1200,330 L0,330 Z;
          M0,280 Q300,308 600,278 T1200,285 L1200,330 L0,330 Z;
          M0,285 Q300,255 600,285 T1200,285 L1200,330 L0,330 Z"
      />
    </path>

    <!-- Subtle Backend Code Accents -->
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#64748B" opacity="0.6">
      <text x="42" y="54">@SpringBootApplication</text>
      <text x="42" y="74">redis.cache :: HIT</text>
      <text x="1018" y="54">kafka.ack :: manual</text>
      <text x="1036" y="74">docker :: healthy</text>
    </g>

    <!-- Centered Availability Pill -->
    <rect x="405" y="28" width="390" height="32" rx="16" fill="#F8FAFC" stroke="#0284C7" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="431" cy="44" r="4.5" fill="#16A34A">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text
      x="608"
      y="48.5"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="11.5"
      font-weight="700"
      letter-spacing="1.1"
      fill="#334155"
    >
      AVAILABLE FOR BACKEND ROLES • NEPAL &amp; REMOTE
    </text>

    <!-- Centered Main Headline -->
    <text
      x="600"
      y="126"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="50"
      font-weight="800"
      letter-spacing="-0.6"
      fill="url(#titleGradLight)"
    >
      Sudarshan GC
    </text>

    <!-- Centered Role & Experience -->
    <text
      x="600"
      y="168"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="19"
      font-weight="700"
      fill="#0284C7"
    >
      Software Engineer @ CAS Total Services  •  ~1 Year Experience
    </text>

    <!-- Centered Bio Lines -->
    <text
      x="600"
      y="208"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="15.5"
      font-weight="500"
      fill="#334155"
    >
      Building enterprise Trade Finance workflows (Newgen iBPS &amp; Temenos T24 APIs) alongside
    </text>
    <text
      x="600"
      y="233"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="15.5"
      font-weight="500"
      fill="#334155"
    >
      scalable Spring Boot REST APIs, Redis caching layers, and Apache Kafka event pipelines.
    </text>

    <!-- Centered Learning Strip -->
    <text
      x="600"
      y="274"
      text-anchor="middle"
      font-family="Consolas, 'SFMono-Regular', Menlo, monospace"
      font-size="13"
      font-weight="500"
      fill="#475569"
    >
      &gt;_ Currently exploring: <tspan fill="#4F46E5" font-weight="700">Distributed Systems</tspan> &amp; <tspan fill="#059669" font-weight="700">Cloud Deployment (AWS)</tspan>
    </text>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="none" stroke="url(#borderGradLight)" stroke-width="2" />
</svg>