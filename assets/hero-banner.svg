<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" role="img" aria-label="Hi, I'm Sudarshan GC - Software Engineer (Java Backend)">
  <defs>
    <clipPath id="bannerClip">
      <rect x="2" y="2" width="1196" height="326" rx="20" />
    </clipPath>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14" />
      <stop offset="50%" stop-color="#0B1325" />
      <stop offset="100%" stop-color="#090E1C" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#34D399;#38BDF8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#34D399;#38BDF8;#818CF8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#38BDF8;#818CF8;#34D399" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background & Grid -->
    <rect x="2" y="2" width="1196" height="326" fill="url(#bgGrad)" />
    <rect x="2" y="2" width="1196" height="326" fill="url(#gridPattern)" />

    <!-- Animated Aurora Orbs -->
    <circle cx="220" cy="80" r="260" fill="url(#orbCyan)">
      <animate attributeName="cx" values="200;310;200" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="70;130;70" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="95" r="270" fill="url(#orbIndigo)">
      <animate attributeName="cx" values="990;880;990" dur="13s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;155;90" dur="13s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="290" r="240" fill="url(#orbEmerald)">
      <animate attributeName="r" values="210;270;210" dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Subtle Animated Bottom Waves -->
    <path fill="url(#waveGrad1)" d="M0,285 Q300,255 600,285 T1200,285 L1200,330 L0,330 Z">
      <animate
        attributeName="d"
        dur="8s"
        repeatCount="indefinite"
        values="
          M0,285 Q300,255 600,285 T1200,285 L1200,330 L0,330 Z;
          M0,280 Q300,308 600,278 T1200,285 L1200,330 L0,330 Z;
          M0,285 Q300,255 600,285 T1200,285 L1200,330 L0,330 Z"
      />
    </path>

    <!-- Subtle Backend Code Accents -->
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#64748B" opacity="0.32">
      <text x="42" y="54">@SpringBootApplication</text>
      <text x="42" y="74">redis.cache :: HIT</text>
      <text x="1018" y="54">kafka.ack :: manual</text>
      <text x="1036" y="74">docker :: healthy</text>
    </g>

    <!-- Centered Availability Pill -->
    <rect x="405" y="28" width="390" height="32" rx="16" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1" />
    <circle cx="431" cy="44" r="4.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text
      x="608"
      y="48.5"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="11.5"
      font-weight="600"
      letter-spacing="1.1"
      fill="#CBD5E1"
    >
      AVAILABLE FOR BACKEND ROLES • NEPAL &amp; REMOTE
    </text>

    <!-- Centered Main Headline -->
    <text
      x="600"
      y="126"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="48"
      font-weight="800"
      letter-spacing="-0.8"
      fill="#F8FAFC"
    >
      Hi, I'm <tspan fill="url(#titleGrad)">Sudarshan GC</tspan>
    </text>

    <!-- Centered Role & Experience -->
    <text
      x="600"
      y="168"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="19.5"
      font-weight="600"
      fill="#38BDF8"
    >
      Software Engineer (Java Backend)  •  1 Year Professional Experience
    </text>

    <!-- Centered Bio Lines -->
    <text
      x="600"
      y="208"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="15.5"
      fill="#CBD5E1"
    >
      Based in Nepal — designing and building reliable REST APIs, multi-tenant SaaS backends,
    </text>
    <text
      x="600"
      y="233"
      text-anchor="middle"
      font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif"
      font-size="15.5"
      fill="#CBD5E1"
    >
      Redis caching layers, and event-driven Apache Kafka systems with Java &amp; Spring Boot.
    </text>

    <!-- Centered Learning Strip -->
    <text
      x="600"
      y="274"
      text-anchor="middle"
      font-family="Consolas, 'SFMono-Regular', Menlo, monospace"
      font-size="13"
      fill="#94A3B8"
    >
      &gt;_ Currently deepening: <tspan fill="#A5B4FC" font-weight="600">AWS Cloud Architecture</tspan> &amp; <tspan fill="#34D399" font-weight="600">Distributed System Design</tspan>
    </text>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2" />
</svg>
